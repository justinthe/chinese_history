name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: "Check gzipped JS budget (PRD §8: <= 150 KB)"
        run: |
          size=$(gzip -c dist/assets/*.js | wc -c)
          echo "JS gzip size: $size bytes"
          [ "$size" -le 153600 ] || { echo "over 150 KB budget"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Lighthouse CI (perf >= 90, a11y >= 95 — architecture.md §6)
        run: npx lhci autorun

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
